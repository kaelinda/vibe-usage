# Anthropic Platform Contract
# API Reference: https://docs.anthropic.com/claude/reference

anthropic:
  name: Anthropic
  description: Claude 3 models (Opus, Sonnet, Haiku)
  api_endpoint: https://api.anthropic.com/v1
  
  auth:
    type: bearer
    header: x-api-key
    format: "{api_key}"
    docs: https://docs.anthropic.com/claude/reference/authentication
  
  headers:
    - name: Content-Type
      value: application/json
    - name: Anthropic-Version
      value: "2023-06-01"
    - name: Anthropic-Organization
      optional: true
  
  # Claude API doesn't have a direct usage endpoint
  # Usage must be calculated from message responses
  message_endpoint: /messages
  method: POST
  
  # Usage tracking via response headers
  usage_headers:
    - name: x-anthropic-usage-input-tokens
      description: Input tokens used
    - name: x-anthropic-usage-output-tokens
      description: Output tokens generated
  
  # Rate limit headers
  rate_limit_headers:
    - name: x-anthropic-rate-limit-limit-tokens
    - name: x-anthropic-rate-limit-remaining-tokens
    - name: x-anthropic-rate-limit-limit-requests
    - name: x-anthropic-rate-limit-remaining-requests
    - name: x-anthropic-rate-limit-reset-tokens
    - name: x-anthropic-rate-limit-reset-requests
  
  rate_limit: ~50 requests/minute (varies by tier)
  
  error_codes:
    401: "Invalid API key"
    403: "Access denied"
    429: "Rate limit exceeded"
    529: "Model overloaded"
  
  models:
    - id: claude-3-opus-20240229
      display_name: Claude 3 Opus
      context_window: 200000
      pricing:
        input: 0.015  # per 1K tokens
        output: 0.075
    - id: claude-3-sonnet-20240229
      display_name: Claude 3 Sonnet
      context_window: 200000
      pricing:
        input: 0.003
        output: 0.015
    - id: claude-3-haiku-20240307
      display_name: Claude 3 Haiku
      context_window: 200000
      pricing:
        input: 0.00025
        output: 0.00125
    - id: claude-2.1
      display_name: Claude 2.1
      context_window: 200000
      pricing:
        input: 0.008
        output: 0.024
    - id: claude-2.0
      display_name: Claude 2.0
      context_window: 100000
      pricing:
        input: 0.008
        output: 0.024
  
  # Note: Anthropic doesn't provide direct quota/usage API
  # Must track usage from each API response
  usage_tracking_strategy: |
    1. Each /messages API call returns usage in response headers
    2. Store cumulative tokens per model in local database
    3. User must manually input their quota limit
    4. Calculate percentage based on: (used / quota) * 100
